name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Setup Cachix (vasara-bpm)
        uses: cachix/cachix-action@v17
        with:
          name: vasara-bpm
          extraPullNames: devenv
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install devenv
        run: nix profile install --accept-flake-config nixpkgs#devenv

      - name: Build NAR and JAR packages
        run: devenv shell -- build

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nifi-controller/nifi-controller-api-nar/target/*.nar
            nifi-controller/nifi-controller-nar/target/*.nar
            nifi-processor/nifi-processor-nar/target/*.nar
            nifi-controller/nifi-controller-api/target/*.jar
            nifi-controller/nifi-controller/target/*.jar
            nifi-processor/nifi-processor-processors/target/*.jar
          generate_release_notes: true
